deck:
  title: Video Workflow Walkthrough
  theme: dark

items:
  - id: intro
    autoFragment: false
    cues:
      - "This slide was rendered directly from Markdown by Deckpilot."

  - id: execution-demo
    cues:
      - "Source video starts."
      - at: 2s
        text: "A timed cue lands here."

  - id: summary
    autoFragment: false
    cues:
      - "The source clip and rendered slides are now one composed presentation."

export:
  outputDir: ./recordings